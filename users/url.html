<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>URL Verification - TruthLens</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/users/css/style.css">
</head>

<body class="p-4">
  <nav class="navbar navbar-expand-lg fixed-top">
    <div class="container-fluid">

      <!-- LEFT GROUP -->
      <div class="nav-left">
        <a href="/" class="home-btn" title="Home">
          <i class="bi bi-house-fill"></i>
        </a>
        <a class="navbar-brand" href="/">TruthLens</a>
      </div>

      <!-- RIGHT SIDE -->
      <div class="nav-right">
        <a class="btn btn-outline-light" href="/news">News</a>
        <a class="btn btn-outline-light" href="/message">Message</a>
        <a class="btn btn-outline-light" href="/url">URL</a>
        <a class="btn btn-outline-light" href="/login">Login</a>
        <a class="btn logout-btn" id="logoutBtn" href="#" onclick="logout()" style="display:none;">
          <i class="bi bi-box-arrow-right"></i> Logout
        </a>
        <a href="/settings" class="settings-btn" title="Settings">
          <i class="bi bi-gear-fill"></i>
        </a>
      </div>
    </div>
  </nav>

  <!-- PAGE TITLE -->
  <div class="page-title">
    <h1 class="quantum-title">URL Verification</h1>
    <p class="quantum-sub">
      Check whether a website is safe or malicious
    </p>
  </div>

  <div class="container">
    <h1 class="text-center mb-4" style="background:linear-gradient(90deg,var(--neon1),var(--neon2));background-clip: text;   
        -webkit-background-clip:text;-webkit-text-fill-color:transparent;">
      URL Verification
    </h1>

    <div class="glass p-4">
      <input type="text" id="url" class="form-control mb-3" placeholder="Paste URL here...">
      <button class="btn btn-primary" onclick="checkURL()">
        Verify
      </button>
      <div id="alertBox" class="detect-alert"></div>
      <div id="urlResult" class="result"></div>
    </div>
  </div>
  
  <script src="/users/js/main.js"></script>
</body>

</html>
