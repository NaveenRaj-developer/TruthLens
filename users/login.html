<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Login - TruthLens</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/users/css/style.css">
</head>

<body class="login-page">
  <nav class="navbar navbar-expand-lg fixed-top">
    <div class="container-fluid">

      <!-- LEFT GROUP -->
      <div class="nav-left">
        <a href="/" class="home-btn" title="Home">
          <i class="bi bi-house-fill"></i>
        </a>

        <a class="navbar-brand" href="/">TruthLens</a>
      </div>
      <!-- RIGHT SIDE -->
      <div class="nav-right">

        <a class="btn btn-outline-light" href="/news">News</a>
        <a class="btn btn-outline-light" href="/message">Message</a>
        <a class="btn btn-outline-light" href="/url">URL</a>
        <a class="btn btn-outline-light" href="/login">Login</a>

        <a class="btn logout-btn" id="logoutBtn" href="#" onclick="logout()" style="display:none;">

          <i class="bi bi-box-arrow-right"></i> Logout
        </a>

        <a href="/settings" class="settings-btn" title="Settings">
          <i class="bi bi-gear-fill"></i>
        </a>
      </div>

    </div>
  </nav>

  <div class="glass-login">
    <h1>Login</h1>

    <input type="email" placeholder="Email ID" required>

    <div class="password-wrapper mb-3">
      <input type="password" id="passwordInput" placeholder="Password" required>
      <i id="togglePassword" class="bi bi-eye-fill password-icon"></i>
    </div>
    <button class="btn btn-primary mt-3 w-100" onclick="login()">
      Login
    </button>

    <p class="mt-3">
      Don't have an account?
      <a href="/signup">Sign Up</a>
    </p>
  </div>
  <script src="/users/js/main.js"></script>
</body>

</html>
