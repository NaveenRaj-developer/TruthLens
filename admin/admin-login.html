<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Login – TruthLens</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/admin/css/style.css">
</head>
<body class="login-page admin-login-page">
  <div class="glass-login">
    <h2>TruthLens Admin Login</h2>
    <input type="text" id="admin-username" placeholder="Username" required>
    <div class="password-wrapper mb-3">
      <input type="password" id="admin-password" placeholder="Password" required>
      <i id="togglePassword" class="bi bi-eye-fill password-icon"></i>
    </div>
    <button class="btn btn-primary mt-3 w-100" onclick="adminLogin()">
      Login
    </button> 
  </div>
<script src="/admin/js/admin.js"></script>
</body>
</html>
